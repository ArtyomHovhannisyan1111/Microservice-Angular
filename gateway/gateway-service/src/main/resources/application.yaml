server:
  port: 8090

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webmvc:
          http-client:
            connect-timeout: PT3S
            response-timeout: PT15S
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8095}
              predicates:
                - Path=/api/products/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/orders/**

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/auth/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8098}
              predicates:
                - Path=/api/notifications/**

            - id: notification-admin
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8098}
              predicates:
                - Path=/api/admin/**

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8092}
              predicates:
                - Path=/api/users/**

            - id: image-service
              uri: ${IMAGE_SERVICE_URL:http://localhost:8099}
              predicates:
                - Path=/api/image/**

            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8096}
              predicates:
                - Path=/api/analytics/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/payment-methods/**

            - id: balance-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/balance/**


