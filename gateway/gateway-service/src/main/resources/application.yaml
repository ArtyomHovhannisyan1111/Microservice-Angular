server:
  port: 8090

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webmvc:
          http-client:
            connect-timeout: PT3S
            response-timeout: PT15S
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/products/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/orders/**

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/auth/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8098}
              predicates:
                - Path=/api/notifications/**

            - id: notification-admin
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8098}
              predicates:
                - Path=/api/admin/**

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/users/**

            - id: image-service
              uri: ${IMAGE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/image/**

            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/analytics/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8093}
              predicates:
                - Path=/api/payment-methods/**

            - id: balance-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8093}
              predicates:
                - Path=/api/v1/balance/**


jwt:
  secret: ${JWT_SECRET:A9gX7mP2qK5zW1vB8nR4tY0eU3iO6pL9sJ2dH5fG8hK1lM4nJ3bV6cC9vX0zZ1qA}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.servlet: DEBUG