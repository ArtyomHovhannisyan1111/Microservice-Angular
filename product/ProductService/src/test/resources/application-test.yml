spring:
  datasource:
    url: jdbc:h2:mem:producttest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  liquibase:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
