name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  MAVEN_OPTS: '-Xmx1024m -XX:+TieredCompilation -XX:TieredStopAtLevel=1'

jobs:

  detect-changes:
    name: "Определение изменений"
    runs-on: ubuntu-latest
    outputs:
      any-backend: ${{ steps.any-backend.outputs.changed }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend-matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Проверка изменённых путей
        id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            auth:
              - 'auth2/auth-service/**'
            gateway:
              - 'gateway/gateway-service/**'
            product:
              - 'product/ProductService/**'
            order:
              - 'order/Order-Service/**'
            user:
              - 'user/user-service/**'
            notification:
              - 'notification/Notifictaion-Service/**'
            payment:
              - 'payment/payment-service/**'
            image:
              - 'image/image-service/**'
            analytics:
              - 'analytics/analytics-service/**'
            frontend:
              - 'frontend/**'

      - name: Проверяем наличие изменений в бэкенде
        id: any-backend
        run: |
          if [[ \
            "${{ steps.filter.outputs.auth }}"         == "true" || \
            "${{ steps.filter.outputs.gateway }}"      == "true" || \
            "${{ steps.filter.outputs.product }}"      == "true" || \
            "${{ steps.filter.outputs.order }}"        == "true" || \
            "${{ steps.filter.outputs.user }}"         == "true" || \
            "${{ steps.filter.outputs.notification }}" == "true" || \
            "${{ steps.filter.outputs.payment }}"      == "true" || \
            "${{ steps.filter.outputs.image }}"        == "true" || \
            "${{ steps.filter.outputs.analytics }}"    == "true" \
          ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # Matrix includes dockerfile path so docker-build-push uses the correct Dockerfile per service
      - name: Формируем JSON-матрицу изменённых сервисов
        id: build-matrix
        run: |
          services=()

          [[ "${{ steps.filter.outputs.auth }}" == "true" ]] && \
            services+=('{"name":"auth-service","path":"auth2/auth-service","dockerfile":"auth2/Dockerfile"}')
          [[ "${{ steps.filter.outputs.gateway }}" == "true" ]] && \
            services+=('{"name":"gateway-service","path":"gateway/gateway-service","dockerfile":"gateway/Dockerfile"}')
          [[ "${{ steps.filter.outputs.product }}" == "true" ]] && \
            services+=('{"name":"product-service","path":"product/ProductService","dockerfile":"product/Dockerfile"}')
          [[ "${{ steps.filter.outputs.order }}" == "true" ]] && \
            services+=('{"name":"order-service","path":"order/Order-Service","dockerfile":"order/Dockerfile"}')
          [[ "${{ steps.filter.outputs.user }}" == "true" ]] && \
            services+=('{"name":"user-service","path":"user/user-service/user-service","dockerfile":"user/Dockerfile"}')
          [[ "${{ steps.filter.outputs.notification }}" == "true" ]] && \
            services+=('{"name":"notification-service","path":"notification/Notifictaion-Service","dockerfile":"notification/Dockerfile"}')
          [[ "${{ steps.filter.outputs.payment }}" == "true" ]] && \
            services+=('{"name":"payment-service","path":"payment/payment-service/Payment-Service","dockerfile":"payment/payment-service/Payment-Service/Dockerfile"}')
          [[ "${{ steps.filter.outputs.image }}" == "true" ]] && \
            services+=('{"name":"image-service","path":"image/image-service/image-service","dockerfile":"image/Dockerfile"}')
          [[ "${{ steps.filter.outputs.analytics }}" == "true" ]] && \
            services+=('{"name":"analytics-service","path":"analytics/analytics-service","dockerfile":"analytics/analytics-service/Dockerfile"}')

          if [ ${#services[@]} -eq 0 ]; then
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
          else
            joined=$(IFS=,; echo "${services[*]}")
            echo "matrix={\"include\":[$joined]}" >> $GITHUB_OUTPUT
          fi


  test-backend:
    name: "Тесты — ${{ matrix.name }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.any-backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.backend-matrix) }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Установка JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: "Тесты — ${{ matrix.name }}"
        working-directory: ${{ matrix.path }}
        run: mvn test --no-transfer-progress
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Публикация результатов тестов
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '${{ matrix.path }}/target/surefire-reports/TEST-*.xml'
          check_name: 'Tests — ${{ matrix.name }}'


  build-backend:
    name: "Сборка JAR — ${{ matrix.name }}"
    needs: [ detect-changes, test-backend ]
    if: needs.detect-changes.outputs.any-backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.backend-matrix) }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Установка JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: "Сборка JAR — ${{ matrix.name }}"
        working-directory: ${{ matrix.path }}
        run: mvn package -DskipTests --no-transfer-progress

      - name: Сохранение JAR-артефакта
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.name }}-jar
          path: ${{ matrix.path }}/target/*.jar
          retention-days: 7


  build-frontend:
    name: "Сборка Angular (production)"
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Установка Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка npm-зависимостей
        working-directory: frontend
        run: npm ci

      - name: "Сборка production-бандла"
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Сохранение dist-артефакта
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7


  # Builds and pushes only the services that actually changed (dynamic matrix from detect-changes)
  docker-build-push:
    name: "Docker — ${{ matrix.name }}"
    needs: [ detect-changes, build-backend ]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.detect-changes.outputs.any-backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.backend-matrix) }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Генерация тегов
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - name: "Build & Push — ${{ matrix.name }}"
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  docker-build-push-frontend:
    name: "Docker — frontend"
    needs: [ detect-changes, build-frontend ]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Генерация тегов
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - name: "Build & Push — frontend"
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: "Деплой на сервер"
    needs: [ docker-build-push, docker-build-push-frontend ]
    # Deploy only when at least one Docker image was actually built and pushed
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.docker-build-push.result == 'success' || needs.docker-build-push-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Деплой через SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/deploy/app

            git pull origin master

            # Update .env with all required variables
            update_env() {
              local key=$1
              local value=$2
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }

            update_env "DOCKER_HUB_USER" "${{ secrets.DOCKER_USERNAME }}"
            update_env "MAIL_USERNAME" "${{ secrets.MAIL_USERNAME }}"
            update_env "MAIL_PASSWORD" "${{ secrets.MAIL_PASSWORD }}"

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "==> Деплой завершён. Статус контейнеров:"
            docker compose ps
