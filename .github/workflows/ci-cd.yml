name: CI/CD
on:
  push:
    branches: [master]
jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKER_USERNAME }}", password: "${{ secrets.DOCKER_TOKEN }}" }
      - run: |
          U=${{ secrets.DOCKER_USERNAME }}
          docker build -t $U/auth-service:latest         -f auth2/Dockerfile                                   auth2/auth-service                      && docker push $U/auth-service:latest
          docker build -t $U/gateway-service:latest      -f gateway/Dockerfile                                 gateway/gateway-service                 && docker push $U/gateway-service:latest
          docker build -t $U/product-service:latest      -f product/Dockerfile                                 product/ProductService                  && docker push $U/product-service:latest
          docker build -t $U/order-service:latest        -f order/Dockerfile                                   order/Order-Service                     && docker push $U/order-service:latest
          docker build -t $U/user-service:latest         -f user/Dockerfile                                    user/user-service/user-service          && docker push $U/user-service:latest
          docker build -t $U/notification-service:latest -f notification/Dockerfile                            notification/Notifictaion-Service       && docker push $U/notification-service:latest
          docker build -t $U/payment-service:latest      -f payment/payment-service/Payment-Service/Dockerfile payment/payment-service/Payment-Service && docker push $U/payment-service:latest
          docker build -t $U/image-service:latest        -f image/Dockerfile                                   image/image-service/image-service       && docker push $U/image-service:latest
          docker build -t $U/analytics-service:latest    -f analytics/analytics-service/Dockerfile             analytics/analytics-service             && docker push $U/analytics-service:latest
          docker build -t $U/frontend:latest             -f frontend/Dockerfile                                frontend                                && docker push $U/frontend:latest
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: cd /root/mikroservis && git pull origin master && docker compose -p app pull && docker compose -p app up -d --remove-orphans && docker image prune -f
