name: CI/CD
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 2222
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/mikroservis
            git pull origin master
            docker compose -p app up -d --build --remove-orphans
            docker image prune -f
