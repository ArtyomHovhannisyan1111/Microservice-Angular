name: CI
on: [push, pull_request]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: product-service,      path: product/ProductService }
          - { name: order-service,        path: order/Order-Service }
          - { name: notification-service, path: notification/Notifictaion-Service }
          - { name: auth-service,         path: auth/auth-service }
          - { name: gateway-service,      path: gateway/gateway-service }
          - { name: user-service,         path: user/user-service/user-service }
          - { name: image-service,        path: image/image-service/image-service }
          - { name: analytics-service,    path: analytics/analytics-service }
          - { name: payment-service,      path: payment/payment-service/Payment-Service }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin, cache: maven }
      - name: Build ${{ matrix.service.name }}
        run: mvn package -DskipTests --no-transfer-progress -f ${{ matrix.service.path }}/pom.xml

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend