name: CI
on: [push, pull_request]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: product,      path: product/ProductService }
          - { name: order,        path: order/Order-Service }
          - { name: notification, path: notification/Notifictaion-Service }
          - { name: auth,         path: auth/auth-service }
          - { name: gateway,      path: gateway/gateway-service }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin, cache: maven }
      - name: Build ${{ matrix.service.name }}
        run: mvn package -DskipTests --no-transfer-progress -f ${{ matrix.service.path }}/pom.xml
